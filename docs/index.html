<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Albums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="page-h"><h1>Albums</h1><p id="sub"></p></div>
<main id="cards" class="cards"></main>
<footer id="foot"></footer>
<script>
(async () => {
  const [site, albums] = await Promise.all([getJSON('data/site.json'), getJSON('data/albums.json')]);
  document.title = site.siteName + ' — ' + site.tagline;
  renderBar(site, { active: 'albums' });
  $('sub').textContent = site.tagline;
  $('foot').textContent = '© ' + new Date().getFullYear() + ' ' + site.siteName + (site.contact ? ' · ' + site.contact : '');
  if (!albums.length) { $('cards').outerHTML = '<p class="empty">作品整理中，敬請期待。</p>'; return; }
  $('cards').innerHTML = albums.map((a) => `<a class="card" href="album.html?a=${a.slug}">
    <div class="ph"><img loading="lazy" style="object-position:50% ${a.coverPos}%;opacity:0" onload="this.style.opacity=1" src="${url.thumb(a.slug, a.coverBase)}" alt=""></div>
    <h2></h2><p>${a.date ? fmtDate(a.date) + ' · ' : ''}${a.count} PHOTOS</p></a>`).join('');
  $('cards').querySelectorAll('h2').forEach((h, i) => (h.textContent = albums[i].title));
})();
</script>
</body>
</html>
