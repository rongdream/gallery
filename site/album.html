<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<section class="cover" id="cover"></section>
<div class="sect" id="sect"><h2></h2><p></p></div>
<div id="grid"></div>
<div id="about"></div>
<footer id="foot"></footer>
<div id="lb">
  <div class="hd"><span id="cnt"></span><div id="lbTools"></div></div>
  <button class="nav prev" id="prev" aria-label="上一張"></button><button class="nav next" id="next" aria-label="下一張"></button>
  <div class="stage" id="stage"><img id="big" alt=""></div>
</div>
<script>
const ADMIN = ['localhost', '127.0.0.1'].includes(location.hostname);
(async () => {
  const slug = new URLSearchParams(location.search).get('a');
  let m, site;
  async function load() { [m, site] = await Promise.all([getJSON(`data/${slug}.json`), getJSON('data/site.json')]); }
  try { await load(); }
  catch { document.body.innerHTML = '<p class="empty">找不到這本相簿，請確認網址是否正確。</p>'; return; }
  const P = m.photos;
  const canDL = m.downloads !== false;
  const hasDL = canDL && (m.zips.web || m.zips.original);
  const dl = [];
  if (m.zips.web) dl.push(`<a href="${url.zip(slug, m.zips.web.file)}" download>全部照片・小檔 ZIP<span>${fmtSize(m.zips.web.size)}</span></a>`);
  if (m.zips.original) dl.push(`<a href="${url.zip(slug, m.zips.original.file)}" download>全部照片・原檔 ZIP<span>${fmtSize(m.zips.original.size)}</span></a>`);
  renderBar(site, { active: 'albums', tools: hasDL ? `<div class="menu" id="menu"><button class="ic" id="dlBtn" title="下載">${ICON.down}</button><div class="pop">${dl.join('')}<p>單張下載：點開照片後使用上方按鈕</p></div></div>` : '' });
  if (hasDL) {
    $('dlBtn').onclick = (e) => { e.stopPropagation(); $('menu').classList.toggle('open'); };
    document.addEventListener('click', () => $('menu').classList.remove('open'));
  }
  if (m.visibility === 'private') document.querySelector('.bar nav').style.visibility = 'hidden';
  $('foot').textContent = '© ' + new Date().getFullYear() + ' ' + site.siteName;
  $('about').innerHTML = aboutHTML(site);

  // 封面（框式 / 滿版）。先用縮圖秒開，再換成較大的瀏覽版
  function renderCover() {
    document.title = m.title + ' — ' + site.siteName;
    const cp = P.find((p) => p.name === m.cover) || P[0];
    const c = $('cover');
    c.className = 'cover ' + (m.coverStyle === 'full' ? 'full' : 'frame');
    c.style.background = m.coverColor || '#54493c';
    const titleBlock = '<div class="tt"><h1></h1><hr><div class="dt"></div></div>';
    const chev = '<a class="chev" href="#sect" aria-label="往下"><svg viewBox="0 0 34 20"><path d="M1 3l16 14L33 3"/></svg></a>';
    if (m.coverStyle === 'full') {
      c.style.background = `${m.coverColor} center ${m.coverPos ?? 50}% / cover no-repeat`;
      c.style.backgroundImage = `url("${url.thumb(slug, cp.base)}")`;
      c.innerHTML = titleBlock + chev;
      const im = new Image(); im.onload = () => (c.style.backgroundImage = `url("${im.src}")`); im.src = url.view(slug, cp.base);
    } else {
      c.innerHTML = `<div class="stack"><div class="vt"></div><img class="ph" alt="" src="${url.thumb(slug, cp.base)}">${titleBlock}</div>` + chev;
      c.querySelector('.vt').textContent = `${site.brandLine || 'PHOTOS BY'} ${site.siteName}`;
      const ph = c.querySelector('.ph'); const im = new Image(); im.onload = () => (ph.src = im.src); im.src = url.view(slug, cp.base);
    }
    c.querySelector('h1').textContent = m.title;
    c.querySelector('.dt').textContent = fmtDate(m.date || '');
    if (!m.date) { c.querySelector('.dt').style.display = 'none'; c.querySelector('hr').style.display = 'none'; }
    $('sect').querySelector('h2').textContent = m.title;
    $('sect').querySelector('p').textContent = `${m.count} PHOTOS`;
  }
  renderCover();

  // 瀑布流：依序放進目前最矮的一欄，圖片按比例預留空間，不會跳動
  let lastCols = 0;
  function layout() {
    const w = $('grid').clientWidth;
    const n = w >= 1100 ? 4 : w >= 700 ? 3 : 2;
    if (n === lastCols && $('grid').children.length) return;
    lastCols = n;
    const cols = Array.from({ length: n }, () => ({ el: document.createElement('div'), h: 0 }));
    cols.forEach((c) => (c.el.className = 'col'));
    P.forEach((p, i) => {
      const c = cols.reduce((a, b) => (b.h < a.h ? b : a));
      const it = document.createElement('div');
      it.className = 'it'; it.dataset.i = i; it.style.aspectRatio = `${p.w} / ${p.h}`;
      const im = document.createElement('img'); im.loading = 'lazy'; im.alt = ''; im.src = url.thumb(slug, p.base);
      im.onload = () => im.classList.add('on');
      it.append(im); c.el.append(it); c.h += p.h / p.w;
    });
    $('grid').replaceChildren(...cols.map((c) => c.el));
  }
  layout();
  let lw = innerWidth;
  addEventListener('resize', () => { if (Math.abs(innerWidth - lw) > 30) { lw = innerWidth; layout(); } });
  $('grid').addEventListener('click', (e) => {
    const it = e.target.closest('.it'); if (!it) return;
    if (window.pickCover) return window.pickCover(+it.dataset.i);
    openLb(+it.dataset.i);
  });

  // 燈箱
  let cur = 0;
  const lb = $('lb'), big = $('big');
  $('prev').innerHTML = ICON.prev; $('next').innerHTML = ICON.next;
  $('lbTools').innerHTML = `${ADMIN ? '<button class="tb" id="setCover">★ 設為封面</button>' : ''}${canDL ? '<button class="tb opt" id="dlSmall"></button><a class="tb" id="dlOrig"></a>' : ''}<button class="x" id="closeLb" aria-label="關閉">${ICON.x}</button>`;
  const preload = (i) => { const p = P[(i + P.length) % P.length]; new Image().src = url.view(slug, p.base); };
  function show(i) {
    cur = (i + P.length) % P.length;
    const p = P[cur];
    big.src = url.thumb(slug, p.base); // 縮圖已在快取中，先秒顯示再換大圖
    const im = new Image(); const mine = cur;
    im.onload = () => { if (mine === cur) big.src = im.src; };
    im.src = url.view(slug, p.base);
    $('cnt').textContent = `${cur + 1} / ${P.length}`;
    if (canDL) {
      $('dlOrig').href = url.orig(slug, p.name); $('dlOrig').setAttribute('download', p.name);
      $('dlOrig').textContent = `下載原檔 ${fmtSize(p.origSize)}`;
      $('dlSmall').textContent = `下載小檔 ${Math.round(p.webSize / 1024)} KB`;
    }
    preload(cur + 1); preload(cur + 2); preload(cur - 1);
  }
  function openLb(i) { lb.classList.add('open'); document.body.style.overflow = 'hidden'; show(i); }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  $('closeLb').onclick = closeLb;
  $('prev').onclick = () => show(cur - 1); $('next').onclick = () => show(cur + 1);
  $('stage').addEventListener('click', (e) => { if (e.target === $('stage')) closeLb(); }); // 點圖片以外的空白處也能關閉
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1);
  });
  let sx = null;
  lb.addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx === null) return; const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1)); sx = null; });
  if (canDL) $('dlSmall').onclick = async () => {
    const p = P[cur];
    try {
      const blob = await fetch(url.web(slug, p.base)).then((r) => r.blob());
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = p.base + '.jpg'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch { window.open(url.web(slug, p.base), '_blank'); toast('已在新分頁開啟，請長按或右鍵另存'); }
  };

  if (ADMIN) {
    const s = document.createElement('script');
    s.src = 'admin.js';
    s.onload = () => window.initAdmin({ slug, getAlbum: () => m, reload: async () => { await load(); renderCover(); }, closeLb, getCur: () => P[cur] });
    document.head.append(s);
  }
})();
</script>
</body>
</html>
