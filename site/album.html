<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<section class="hero" id="hero"><div class="in"><h1 id="h1"></h1><p id="meta"></p><a class="btn" href="#grid">瀏覽照片</a></div></section>
<div class="bar">
  <div class="t" id="bt"></div>
  <nav>
    <a class="home" href="./" id="homeLink">作品集</a>
    <div class="menu" id="menu">
      <button class="btn solid" id="dlBtn">下載 ▾</button>
      <div class="pop" id="pop"></div>
    </div>
  </nav>
</div>
<div id="grid"></div>
<footer id="foot"></footer>
<div id="lb">
  <div class="hd"><span id="cnt"></span><div><button id="dlSmall">下載小檔</button><a class="ib" id="dlOrig">下載原檔</a><button id="close">✕ 關閉</button></div></div>
  <button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button>
  <div class="stage"><img id="big" alt=""></div>
</div>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('a');
  let m, site;
  try { [m, site] = await Promise.all([getJSON(`data/${slug}.json`), getJSON('data/site.json')]); }
  catch { document.body.innerHTML = '<p class="empty" style="padding:120px 20px;text-align:center">找不到這本相簿，請確認網址是否正確。</p>'; return; }
  const P = m.photos;
  document.title = m.title + ' — ' + site.siteName;
  h1.textContent = m.title; bt.textContent = m.title;
  meta.textContent = `${fmtDate(m.date)} · ${m.count} PHOTOS`;
  foot.textContent = '© ' + new Date().getFullYear() + ' ' + site.siteName;
  const cover = P.find((p) => p.name === m.cover) || P[0];
  hero.style.backgroundImage = `url("${url.web(slug, cover)}")`;
  if (m.visibility === 'private') homeLink.style.display = 'none';

  // 下載選單
  const items = [];
  if (m.zips.web) items.push(`<a href="${url.zip(slug, m.zips.web.file)}" download>全部照片・小檔 ZIP<span>${fmtSize(m.zips.web.size)}</span></a>`);
  if (m.zips.original) items.push(`<a href="${url.zip(slug, m.zips.original.file)}" download>全部照片・原檔 ZIP<span>${fmtSize(m.zips.original.size)}</span></a>`);
  pop.innerHTML = items.join('') + '<button disabled style="color:var(--muted);cursor:default">單張下載：點開照片後使用右上角按鈕</button>';
  dlBtn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('click', () => menu.classList.remove('open'));

  // 等高排版（justified rows）
  function layout() {
    const W = grid.clientWidth - 2, gap = 6, target = W < 600 ? 150 : W < 1000 ? 220 : 300;
    let html = '', row = [], sum = 0;
    const flush = (last) => {
      const g = gap * (row.length - 1);
      let h = (W - g) / sum;
      if (last && h > target * 1.3) h = target;
      html += '<div class="row">' + row.map(({ p, i }) => `<div class="it" data-i="${i}" style="width:${(p.w / p.h * h).toFixed(2)}px;height:${h.toFixed(2)}px"><img loading="lazy" src="${url.thumb(slug, p)}" alt="" onload="this.classList.add('on')"></div>`).join('') + '</div>';
      row = []; sum = 0;
    };
    P.forEach((p, i) => {
      row.push({ p, i }); sum += p.w / p.h;
      if (sum * target + gap * (row.length - 1) >= W) flush(false);
    });
    if (row.length) flush(true);
    grid.innerHTML = html;
  }
  layout();
  let lastW = grid.clientWidth;
  addEventListener('resize', () => { if (Math.abs(grid.clientWidth - lastW) > 20) { lastW = grid.clientWidth; layout(); } });
  grid.addEventListener('click', (e) => { const it = e.target.closest('.it'); if (it) open(+it.dataset.i); });

  // 燈箱
  let cur = 0;
  const show = (i) => {
    cur = (i + P.length) % P.length;
    const p = P[cur];
    big.src = url.web(slug, p);
    cnt.textContent = `${cur + 1} / ${P.length}`;
    dlOrig.href = url.orig(slug, p); dlOrig.setAttribute('download', p.name);
    dlOrig.textContent = `下載原檔 (${fmtSize(p.origSize)})`;
    dlSmall.textContent = `下載小檔 (${Math.round(p.webSize / 1024)} KB)`;
    new Image().src = url.web(slug, P[(cur + 1) % P.length]);
  };
  const open = (i) => { lb.classList.add('open'); document.body.style.overflow = 'hidden'; show(i); };
  const closeLb = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
  close.onclick = closeLb; prev.onclick = () => show(cur - 1); next.onclick = () => show(cur + 1);
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1);
  });
  let sx = null;
  lb.addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx === null) return; const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1)); sx = null; });
  dlSmall.onclick = async () => {
    const p = P[cur];
    try {
      const blob = await fetch(url.web(slug, p)).then((r) => r.blob());
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = p.base + '.jpg'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch { window.open(url.web(slug, p), '_blank'); toast('已在新分頁開啟，請長按或右鍵另存'); }
  };
})();
</script>
</body>
</html>
